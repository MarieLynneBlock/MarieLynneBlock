name: toolbox

# Regenerates the toolbox SVG whenever its config or renderer changes.

on:
  push:
    branches: [master]
    paths:
      - generators/toolbox/**
      - generators/nord.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playground
  cancel-in-progress: false

jobs:
  toolbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: generators/requirements.txt
      - run: pip install -r generators/requirements.txt
      - run: python generators/toolbox/toolbox.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/toolbox
          git diff --cached --quiet && exit 0
          git commit -m "toolbox: regenerate"
          git pull --rebase origin master
          git push origin HEAD:master
